    Municipality:
      type: object
      description: Spanish municipality with administrative identifiers
      properties:
        municipalityId:
          type: string
          description: Municipality numeric identifier
        provinceId:
          type: string
          description: Province numeric identifier
        regionId:
          type: string
          description: Autonomous community numeric identifier
        municipality:
          type: string
          description: Municipality name
        province:
          type: string
          description: Province name
        region:
          type: string
          description: Autonomous community name
      required:
        - municipalityId
        - provinceId
        - regionId
        - municipality
        - province
        - region

    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              description: Human-readable error message
            code:
              type: string
              description: Machine-readable error code
              enum:

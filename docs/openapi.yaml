    url: https://github.com/JGeek00/fuel-stations-spain-api

servers:
  - url: http://localhost:{port}
    description: Local development server
    variables:
      port:
        default: "3000"
        description: Port the API server is running on

tags:
  - name: Service Stations
    description: Operations with fuel stations and realtime prices
  - name: Historic Prices
    description: Historical fuel price data for a specific station
  - name: Municipalities
    description: Municipality, province and region reference data
  - name: Health
    description: Health check endpoint

paths:
  /service-stations:
    get:
      tags:
        - Service Stations
      summary: List fuel stations
      description: |
        Returns a paginated list of fuel stations with their realtime prices. Supports filtering by station ID(s), municipality ID, or geolocation (coordinates + radius).

        When no filter is provided, results are paginated with `limit` and `offset`.

        When `id`, `coordinates`, or `municipalityId` is provided, pagination is disabled and all matching results are returned.
      operationId: getServiceStations
      parameters:
        - name: limit
          in: query
          description: |
            Maximum number of results to return per page. Only applied when no other filter (`id`, `coordinates`, `municipalityId`) is provided. Maximum effective page size is 200.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 30
        - name: offset
          in: query
          description: Number of results to skip. Only applied when no other filter is provided. Must be lower than `limit`.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: id
          in: query
          description: |
            One or more station IDs to filter by. When provided, pagination parameters are ignored and all matching stations are returned. Pass multiple values as repeated query parameters.
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: municipalityId
          in: query
          description: Filter stations by municipality ID. When provided, pagination parameters are ignored.
          required: false
          schema:
            type: integer
            format: int32
        - name: coordinates
          in: query
          description: |
            Latitude and longitude in WGS84 format, separated by a comma (e.g. `40.4168,-3.7038`). Filters stations within a bounding box around the given point. Latitude: -90 to 90. Longitude: -180 to 180.
          required: false
          schema:
            type: string
            pattern: '^-?[0-9]+\.?[0-9]*,-?[0-9]+\.?[0-9]*$'
            example: "40.4168,-3.7038"
        - name: distance
          in: query
          description: |
            Search radius in kilometers around the `coordinates` point. If `distance` is provided, `coordinates` is also required. Minimum: 10 km, maximum: 50 km. Default: 30 km.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 10
            maximum: 50
            default: 30
      responses:
        "200":
          description: Successful response with fuel station data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFuelStationsResponse'
              example:
                lastUpdated: "2025-01-15T08:30:00.000Z"
                count: 28453
                results:
                  - stationId: "280789999"
                    postalCode: "28078"
                    address: "Calle Ejemplo, 1"
                    openingHours: "24H"
                    latitude: 40.4168
                    longitude: -3.7038
                    locality: "Madrid"
                    margin: "N"
                    municipality: "Madrid"
                    province: "MADRID"
                    referral: "dm"
                    signage: "REPSOL"
                    saleType: "P"
                    percBioEthanol: "10"
                    percMethylEster: "7"
                    municipalityId: 7949
                    provinceId: 28
                    regionId: 29
                    ammoniaPrice: null
                    biodieselPrice: null
                    bioethanolPrice: null
                    compressedBiogasPrice: null
                    liquefiedBiogasPrice: null
                    renewableDieselPrice: null
                    cngPrice: null
                    lngPrice: null
                    lpgPrice: null
                    gasoilAPrice: null
                    gasoilBPrice: 1.459
                    premiumGasoilPrice: null
                    gasoline95E10Price: 1.549
                    gasoline95E25Price: null
                    gasoline95E5Price: null
                    gasoline95E5PremiumPrice: null
                    gasoline95E85Price: null
                    gasoline98E10Price: null
                    gasoline98E5Price: null
                    renewableGasolinePrice: null
                    hydrogenPrice: null
                    methanolPrice: null
                    adbluePrice: 0.899
        "400":
          description: Validation error or bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                validationError:
                  summary: Validation error
                  value:
                    error:
                      message: "Validation failed"
                      code: "VALIDATION_ERROR"
                      details:
                        - type: "field"
                          value: "abc"
                          msg: "Limit parameter must be an int value"
                          path: "limit"
                          location: "query"
                badRequest:
                  summary: Bad request
                  value:
                    error:
                      message: "Offset must be lower than limit"
                      code: "BAD_REQUEST"
                coordinatesRequired:
                  summary: Coordinates required with distance
                  value:
                    error:
                      message: "If the distance parameter is defined, the coordinates parameter is also required"
                      code: "VALIDATION_ERROR"
        "404":
          description: Endpoint not found (disabled via configuration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /historic-prices:
    get:
      tags:
        - Historic Prices
      summary: Get historic fuel prices
      description: |
        Returns historical fuel prices for a specific station over a date range.

        The date range cannot exceed 1 year between `startDate` and `endDate`.

        Use `includeCurrentPrices=true` to append the current realtime price as the last element in the results array.
      operationId: getHistoricPrices
      parameters:
        - name: id
          in: query
          description: Station ID to retrieve historic prices for. Only one ID is allowed.
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          description: "Start date for the query range (inclusive). Format: yyyy-mm-dd."
          required: true
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: endDate
          in: query
          description: "End date for the query range (inclusive). Format: yyyy-mm-dd. Must be after `startDate` and within 1 year."
          required: true
          schema:
            type: string
            format: date
            example: "2024-12-31"
        - name: includeCurrentPrices
          in: query
          description: When `true`, appends the current realtime price to the results with today's date.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Successful response with historic price data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoricPrice'
              example:
                - stationId: "280789999"
                  stationSignage: "REPSOL"
                  date: "2024-06-15"
                  ammoniaPrice: null
                  biodieselPrice: null
                  bioethanolPrice: null
                  compressedBiogasPrice: null
                  liquefiedBiogasPrice: null
                  renewableDieselPrice: null
                  cngPrice: null
                  lngPrice: null
                  lpgPrice: null
                  gasoilAPrice: null
                  gasoilBPrice: 1.529
                  premiumGasoilPrice: null
                  gasoline95E10Price: 1.619
                  gasoline95E25Price: null
                  gasoline95E5Price: null
                  gasoline95E5PremiumPrice: null
                  gasoline95E85Price: null
                  gasoline98E10Price: null
                  gasoline98E5Price: null
                  renewableGasolinePrice: null
                  hydrogenPrice: null
                  methanolPrice: null
                  adbluePrice: 0.929
        "400":
          description: Validation error or bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                missingId:
                  summary: Missing required id parameter
                  value:
                    error:
                      message: "The id parameter is required"
                      code: "VALIDATION_ERROR"
                invalidDate:
                  summary: Invalid date format
                  value:
                    error:
                      message: "Invalid format for startDate. Must be yyyy-mm-dd."
                      code: "VALIDATION_ERROR"
                dateOrder:
                  summary: Start date must be before end date
                  value:
                    error:
                      message: "startDate must be an earlier date than endDate"
                      code: "BAD_REQUEST"
                dateRange:
                  summary: Date range exceeds 1 year
                  value:
                    error:
                      message: "The maximum difference between the dates cannot be greater than 1 year"
                      code: "BAD_REQUEST"
        "404":
          description: Endpoint not found (disabled via configuration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /municipalities:
    get:
      tags:
        - Municipalities
      summary: List municipalities
      description: Returns the complete list of Spanish municipalities with their associated provinces and autonomous regions (comunidades autónomas).
      operationId: getMunicipalities
      responses:
        "200":
          description: Successful response with municipality data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMunicipalitiesResponse'
              example:
                municipalities:
                  - municipalityId: "28079"
                    provinceId: "28"
                    regionId: "29"
                    municipality: "Madrid"
                    province: "MADRID"
                    region: "Madrid"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /healthcheck:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns HTTP 200 if the service is healthy and the database contains data, HTTP 500 otherwise. Response body is empty.
      operationId: healthcheck
      responses:
        "200":
          description: Service is healthy
          content: {}
        "500":
          description: Service is unhealthy or database is not available
          content: {}

components:
  schemas:
    GetFuelStationsResponse:
      type: object
      properties:
        lastUpdated:
          type: string
          format: date-time
          description: Timestamp of the last data update from the government API
        count:
          type: integer
          format: int32
          description: Total number of fuel stations matching the query
        results:
          type: array
          items:
            $ref: '#/components/schemas/FuelStation'
      required:
        - lastUpdated
        - count
        - results

    FuelStation:
      type: object
      description: A fuel station with its realtime prices and location data
      properties:
        stationId:
          type: string
          nullable: true
          description: Unique identifier of the fuel station
        postalCode:
          type: string
          nullable: true
          description: Postal code of the station
        address:
          type: string
          nullable: true
          description: Full street address of the station
        openingHours:
          type: string
          nullable: true
          description: Opening hours (e.g., "24H", "L-V 07:00-22:00")
        latitude:
          type: number
          format: float
          nullable: true
          description: Latitude coordinate (WGS84)
        longitude:
          type: number
          format: float
          nullable: true
          description: Longitude coordinate (WGS84)
        locality:
          type: string
          nullable: true
          description: Locality name
        margin:
          type: string
          nullable: true
          description: |
            Margin type. Possible values:
            - `N`: Normal
            - `D`: Discounted (descuento)
            - `I`: Independent
        municipality:
          type: string
          nullable: true
          description: Municipality name
        province:
          type: string
          nullable: true
          description: Province name
        referral:
          type: string
          nullable: true
          description: |
            Referral type. Possible values:
            - `dm`: Direct management
            - `OM`: Concession
        signage:
          type: string
          nullable: true
          description: Brand/signage of the station (e.g., "REPSOL", "CEPSA", "GALP")
        saleType:
          type: string
          nullable: true
          description: |
            Sale type. Possible values:
            - `P`: Pump (self-service)
            - `R`: Attendant
            - `A`: Both
        percBioEthanol:
          type: string
          nullable: true
          description: Percentage of bioethanol in gasoline
        percMethylEster:
          type: string
          nullable: true
          description: Percentage of methyl ester in diesel
        municipalityId:
          type: integer
          format: int32
          nullable: true
          description: Municipality reference ID
        provinceId:
          type: integer
          format: int32
          nullable: true
          description: Province reference ID
        regionId:
          type: integer
          format: int32
          nullable: true
          description: Autonomous region (CCAA) reference ID
        ammoniaPrice:
          type: number
          format: float
          nullable: true
          description: Ammonia price in EUR per liter
        biodieselPrice:
          type: number
          format: float
          nullable: true
          description: Biodiesel price in EUR per liter
        bioethanolPrice:
          type: number
          format: float
          nullable: true
          description: Bioethanol price in EUR per liter
        compressedBiogasPrice:
          type: number
          format: float
          nullable: true
          description: Compressed biogas (bio-GNC) price in EUR per kg
        liquefiedBiogasPrice:
          type: number
          format: float
          nullable: true
          description: Liquefied biogas (bio-GNL) price in EUR per kg
        renewableDieselPrice:
          type: number
          format: float
          nullable: true
          description: Renewable diesel price in EUR per liter
        cngPrice:
          type: number
          format: float
          nullable: true
          description: Compressed natural gas (GNC) price in EUR per kg
        lngPrice:
          type: number
          format: float
          nullable: true
          description: Liquefied natural gas (GNL) price in EUR per kg
        lpgPrice:
          type: number
          format: float
          nullable: true
          description: LPG (autogas/GLP) price in EUR per liter
        gasoilAPrice:
          type: number
          format: float
          nullable: true
          description: Gasoil A price in EUR per liter
        gasoilBPrice:
          type: number
          format: float
          nullable: true
          description: Gasoil B (standard diesel) price in EUR per liter
        premiumGasoilPrice:
          type: number
          format: float
          nullable: true
          description: Premium diesel price in EUR per liter
        gasoline95E10Price:
          type: number
          format: float
          nullable: true
          description: Gasolina 95 E10 price in EUR per liter
        gasoline95E25Price:
          type: number
          format: float
          nullable: true
          description: Gasolina 95 E25 price in EUR per liter
        gasoline95E5Price:
          type: number
          format: float
          nullable: true
          description: Gasolina 95 E5 price in EUR per liter
        gasoline95E5PremiumPrice:
          type: number
          format: float
          nullable: true
          description: Gasolina 95 E5 Premium price in EUR per liter
        gasoline95E85Price:
          type: number
          format: float
          nullable: true
          description: Gasolina 95 E85 price in EUR per liter
        gasoline98E10Price:
          type: number

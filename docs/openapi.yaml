openapi: 3.1.0
info:
  title: Fuel Stations Spain API
  description: |
    REST API that provides realtime information about fuel prices in Spain.

    Data source: [Spanish government public API](https://datos.gob.es/es/catalogo/e05068001-precio-de-carburantes-en-las-gasolineras-espanolas)

    ## Querying fuel stations

    The `/service-stations` endpoint supports several query strategies:

    - **Pagination** — use `limit` and `offset` to page through all stations (default 30 per page, max 200).
    - **By ID** — filter by one or more station IDs using the `id` parameter.
    - **By municipality** — filter by `municipalityId`.
    - **By geolocation** — provide `coordinates` (latitude,longitude) and optionally `distance` (in km, 10–50, default 30).

    When `id`, `coordinates`, or `municipalityId` is provided, pagination parameters are ignored.

    ## Historic prices

    The `/historic-prices` endpoint returns a daily price history for a specific station over a date range (max 1 year). Optionally include the current price with `includeCurrentPrices=true`.

  version: 1.12.4
  license:
    name: GPL-3.0-only
    url: https://www.gnu.org/licenses/gpl-3.0.html

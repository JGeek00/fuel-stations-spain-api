          nullable: true
        biodieselPrice:
          type: number
          format: double
          nullable: true
        bioethanolPrice:
          type: number
          format: double
          nullable: true
        compressedBiogasPrice:
          type: number
          format: double
          nullable: true
        liquefiedBiogasPrice:
          type: number
          format: double
          nullable: true
        renewableDieselPrice:
          type: number
          format: double
          nullable: true
        cngPrice:
          type: number
          format: double
          nullable: true
        lngPrice:
          type: number
          format: double
          nullable: true
        lpgPrice:
          type: number
          format: double
          nullable: true
        gasoilAPrice:
          type: number
          format: double
          nullable: true
        gasoilBPrice:
          type: number
          format: double
          nullable: true
        premiumGasoilPrice:
          type: number
          format: double
          nullable: true
        gasoline95E10Price:
          type: number
          format: double
          nullable: true
        gasoline95E25Price:
          type: number
          format: double
          nullable: true
        gasoline95E5Price:
          type: number
          format: double
          nullable: true
        gasoline95E5PremiumPrice:
          type: number
          format: double
          nullable: true
        gasoline95E85Price:
          type: number
          format: double
          nullable: true
        gasoline98E10Price:
          type: number
          format: double
          nullable: true
        gasoline98E5Price:
          type: number
          format: double
          nullable: true
        renewableGasolinePrice:
          type: number
          format: double
          nullable: true
        hydrogenPrice:
